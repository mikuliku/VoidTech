name: Unpack VoidTech

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unpack project ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -name 'VoidTech*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "没有找到 VoidTech ZIP 文件"
            exit 1
          fi

          mkdir -p unpacked
          unzip -o "$ZIP" -d unpacked

          ROOT=$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a unpacked/. .
          fi

          rm -rf unpacked
          rm -f "$ZIP"

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "没有新的文件需要提交"
            exit 0
          fi

          git commit -m "Restore complete VoidTech project"
          git push
